name: Publish NuGet

on:
  push:
    tags: ['*']

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test
        run: dotnet test --project tests/OpenHABTestSuite.Tests -c Release

      - name: Build & Pack
        run: dotnet pack src/OpenHABTestSuite/OpenHABTestSuite.csproj --configuration Release --output nupkg

      - name: Push to NuGet
        run: dotnet nuget push "nupkg/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
